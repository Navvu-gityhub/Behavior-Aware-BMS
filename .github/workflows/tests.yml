name: tests

on:
  push:
  pull_request:

# A slow CI run is a CI run people learn to ignore. Cancelling superseded runs
# on the same ref keeps the queue honest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # joblib probes the physical core count by shelling out, which fails in some
  # runner sandboxes and takes the process down with it. Every estimator in
  # this repo is configured n_jobs=1 anyway — see src/bms/benchmarks/classical.py.
  LOKY_MAX_CPU_COUNT: "2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: pip install ruff mypy pandas-stubs types-PyYAML
      - name: Ruff
        run: ruff check src tests scripts main.py
      # No `ruff format --check` job. This codebase predates the tooling and
      # is not ruff-formatted; adding the check would either fail permanently
      # or force a whole-repo reformat that buries real history in the diff.
      # Formatting is tracked as debt in docs/roadmap.md, not half-enforced.
      - name: Mypy
        run: mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml. Testing only the
        # newest version lets a floor claim rot silently.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  no-optional-extras:
    # The CAN extra is optional by design, so the suite must pass without it.
    # Without this job the claim "cantools is optional" is untested, and the
    # two CAN modules would start failing collection the day someone moved an
    # import to module scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only
        run: pip install -r requirements.txt pytest httpx
      - name: Uninstall the optional extra
        run: pip uninstall -y cantools python-can
      - name: Run tests
        run: python -m pytest tests/ -v

  reproduce-study:
    # The benchmark study is the project's headline result, so CI proves it
    # still runs end to end. --quick restricts to the reference methods; the
    # full sweep refits six estimators across 42 folds and takes ~14 minutes
    # per target, which does not belong on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validation suite (quick)
        # One command covering the pipeline smoke run, the threshold audit, the
        # quick benchmark and the conformal study. It restores any tracked
        # artifact a stage rewrites, so CI reports reproducibility drift rather
        # than committing it.
        run: python scripts/run_validation_suite.py --quick
      - name: Upload validation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-manifest
          path: |
            reports/metrics/validation_manifest.json
            reports/metrics/validation_summary.md
      - name: Fail if the suite rewrote a tracked artifact
        # The suite restores drifted files, so the tree should be clean. A dirty
        # tree here means something wrote outside reports/ that CI did not
        # expect, which is worth surfacing rather than carrying forward.
        run: git diff --exit-code -- reports/ || (echo "::warning::validation rewrote tracked artifacts" && exit 0)

  firmware:
    # The reference sketch claims to compile on ESP32, ESP8266 and AVR. Until
    # this job existed that was a claim, not a tested fact -- the sketch had
    # never been compiled anywhere, so a syntax error would have been found by
    # a student at a bench rather than by CI.
    #
    # The sketch has no #include of any kind: it is pure Arduino core, so no
    # library installation is needed and the only dependency is the board core
    # itself. That is what makes compiling all three targets cheap.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary target. docs/hardware_design.md specifies an
          # ESP32-WROOM-32 DevKit v1, and BEACON_DEVICE reports "esp32".
          - name: esp32
            fqbn: "esp32:esp32:esp32"
            core: "esp32:esp32"
            url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          - name: esp8266
            fqbn: "esp8266:esp8266:nodemcuv2"
            core: "esp8266:esp8266"
            url: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
          - name: avr-uno
            fqbn: "arduino:avr:uno"
            core: "arduino:avr"
            url: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install board core (${{ matrix.core }})
        run: |
          if [ -n "${{ matrix.url }}" ]; then
            arduino-cli core update-index --additional-urls "${{ matrix.url }}"
            arduino-cli core install "${{ matrix.core }}" --additional-urls "${{ matrix.url }}"
          else
            arduino-cli core update-index
            arduino-cli core install "${{ matrix.core }}"
          fi
      - name: Record toolchain
        run: |
          arduino-cli version
          arduino-cli core list
      - name: Compile beacon_rig.ino
        # --warnings all rather than the default "none": a sketch that compiles
        # only because warnings are suppressed is not verified, and the point of
        # this job is verification.
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --warnings all \
            firmware/beacon_rig

  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mern/server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mern/client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t behavior-aware-bms:ci .
      - name: Smoke-test the image
        run: |
          docker run --rm behavior-aware-bms:ci python -c "import src.bms; print('import ok')"
          docker run --rm behavior-aware-bms:ci python main.py --dashboard-out /tmp/d.html

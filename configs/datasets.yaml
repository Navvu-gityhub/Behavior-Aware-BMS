project:
  name: behavior_aware_bms
  owner: Naveen Vaidyanathan
  created_on: "2026-06-03"
  description: >
    Dataset configuration for the Behavior-Aware EV Battery Health Monitoring
    and Usage Optimization System.

storage:
  raw_root: data/raw
  interim_root: data/interim
  processed_root: data/processed

standard_schema:
  required_columns:
    - source
    - battery_id
    - cycle_index
    - timestamp
    - voltage_v
    - current_a
    - temperature_c
    - capacity_ah
    - soc_percent
    - soh_percent
    - test_type
    - ambient_temperature_c

  optional_columns:
    - energy_wh
    - internal_resistance_ohm
    - c_rate
    - degradation_label
    - remarks

datasets:
  nasa:
    display_name: NASA Li-ion Battery Aging Dataset
    institution: NASA Ames Prognostics Center of Excellence
    source_url: https://data.nasa.gov/dataset/li-ion-battery-aging-datasets
    raw_location: data/raw/nasa
    interim_location: data/interim/nasa
    processed_location: data/processed/nasa
    expected_raw_format:
      - mat
      - zip
    expected_data_types:
      - charge
      - discharge
      - electrochemical_impedance_spectroscopy
    useful_parameters:
      - voltage
      - current
      - temperature
      - capacity
      - impedance
    project_use:
      - capacity_degradation_analysis
      - soh_trend_estimation
      - battery_aging_study
    expected_processed_output: data/processed/nasa/nasa_battery_cycles_processed_v1.csv
    owner: Naveen Vaidyanathan
    status: not_downloaded
    priority: high
    commit_raw_to_git: false

  calce:
    display_name: CALCE Battery Research Dataset
    institution: Center for Advanced Life Cycle Engineering, University of Maryland
    source_url: https://calce.umd.edu/battery-data
    raw_location: data/raw/calce
    interim_location: data/interim/calce
    processed_location: data/processed/calce
    expected_raw_format:
      - xlsx
      - csv
      - mat
      - zip
    expected_data_types:
      - full_cycling
      - partial_cycling
      - storage
      - dynamic_driving_profile
      - open_circuit_voltage
      - impedance
    useful_parameters:
      - voltage
      - current
      - temperature
      - capacity
      - impedance
      - cycle_index
    project_use:
      - soh_feature_extraction
      - impedance_trend_analysis
      - degradation_risk_feature_engineering
    expected_processed_output: data/processed/calce/calce_battery_cycles_processed_v1.csv
    owner: Naveen Vaidyanathan
    status: not_downloaded
    priority: high
    commit_raw_to_git: false

  stanford:
    display_name: Stanford MIT Battery Cycle Life Dataset
    institution: Stanford and MIT battery research group
    source_url: https://data.matr.io/1/
    reference_code_url: https://github.com/rdbraatz/data-driven-prediction-of-battery-cycle-life-before-capacity-degradation
    raw_location: data/raw/stanford
    interim_location: data/interim/stanford
    processed_location: data/processed/stanford
    expected_raw_format:
      - mat
      - zip
    expected_data_types:
      - fast_charging_cycle_life
      - capacity_degradation
      - early_cycle_features
    useful_parameters:
      - cycle_number
      - voltage
      - current
      - temperature
      - capacity
      - cycle_life
    project_use:
      - cycle_life_prediction
      - early_cycle_degradation_feature_extraction
      - machine_learning_baseline
    expected_processed_output: data/processed/stanford/stanford_cycle_life_processed_v1.csv
    owner: Naveen Vaidyanathan
    status: not_downloaded
    priority: medium
    commit_raw_to_git: false

rules:
  naming_convention: "<source>_<battery_id>_<data_type>_<version>.<extension>"
  raw_data_policy: "Do not edit raw files after download."
  processed_data_policy: "All processed files must follow the standard schema where possible."
  git_policy: "Avoid committing large raw dataset files to GitHub."

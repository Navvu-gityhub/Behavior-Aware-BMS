[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-aware-bms"
version = "0.2.0"
description = "Behaviour-aware analytics layer for EV battery management systems, with a validation gate that refuses by default."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naveen Vaidyanathan" }]
keywords = ["battery", "prognostics", "state-of-health", "cross-validation", "conformal-prediction"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Benchmark-only models. Deliberately optional: the pipeline, the API and
# every calibration script run without them, and `check_availability` reports
# a missing one as an UNAVAILABLE row naming the package rather than crashing
# a fold. torch in particular is a large install to force on someone who only
# wants to run the health index.
benchmarks = [
    "xgboost>=2.0.0",   # src/bms/benchmarks/classical.py::_xgboost
    "torch>=2.0.0",     # src/bms/benchmarks/sequence.py (LSTM)
]
# CAN/DBC decoding. Separated from the core because src/bms/telemetry imports
# it at module level, so an install without it can still run the pipeline,
# the API and every calibration script — the two CAN test modules skip
# cleanly via pytest.importorskip rather than failing collection.
can = ["cantools>=4.4.0", "python-can>=4.0.0"]
# Serial telemetry from a microcontroller rig. Needed ONLY by
# `SerialPortSource`, which reads a physical port. Every other part of the
# serial path — the wire protocol, the schema gate, the emulated rig, replay of
# a recorded capture, and the whole test suite — runs without it, which is what
# keeps the hardware demo path available on a machine with no board attached.
serial = ["pyserial>=3.5"]
# TreeSHAP, used only by scripts/fit_shap_attribution_model.py. The rule-score
# explainer in src/bms/explain/attribution.py uses an exact closed form and
# needs no dependency at all (ADR 0003).
shap = ["shap>=0.44.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
bms-pipeline = "main:main"

[project.urls]
Repository = "https://github.com/Navvu-gityhub/Behavior-Aware-BMS"

[tool.setuptools]
packages = ["src", "src.bms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `smoke_day3.py` is a standalone script, not a pytest module.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:src.bms.*",
]
markers = [
    "slow: refits a model across every cross-validation fold; excluded by `make test-fast`",
]

[tool.coverage.run]
source = ["src/bms"]
omit = [
    # Superseded by src/bms/dashboard/beacon.py; retained for reference only
    # (see README "Project Structure").
    "src/bms/dashboard/dashboard_legacy.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "mern"]

[tool.ruff.lint]
# Deliberately narrower than the full recommended set.
#
# The codebase predates this configuration, and the wider set (adding UP, SIM
# and the RUF rules) reports 250+ findings that are overwhelmingly stylistic
# — quoted annotations, tuple concatenation, legacy typing imports. Enabling
# them would either mean a mechanical rewrite of every file, obscuring real
# history in the diff, or a permanently red pipeline that everyone learns to
# ignore. Neither improves the code.
#
# What is selected here is the set that catches actual defects: undefined
# names, unused variables, redefinitions, mutable defaults, bare excepts. The
# stylistic backlog is recorded in docs/roadmap.md rather than half-enforced.
select = [
    "F",    # pyflakes — real errors
    "E4",   # imports
    "E7",   # statement-level mistakes
    "E9",   # syntax / IO errors
    "B",    # bugbear — likely bugs
    "I",    # import sorting
]
ignore = [
    "E501",  # line length is a formatter concern, and this repo is not formatted
    "B008",  # FastAPI's Depends() in a default is the framework's own idiom
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the entire purpose of a package __init__. Ruff's fix for
# F401 is to delete the import, which here would remove the public API.
"__init__.py" = ["F401"]
"src/bms/**/__init__.py" = ["F401"]
# Registration modules populate a global registry as an import side effect,
# which is the documented design (see benchmarks/registry.py).
"src/bms/benchmarks/*.py" = ["E402"]
"scripts/*.py" = ["E402"]  # sys.path setup must precede local imports
# Tests re-import inside functions to exercise import-time behaviour, and
# assert on constants where a bare assert is the clearest expression.
"tests/*.py" = ["B011", "F811", "F401"]

# --- Pre-existing findings in code this configuration postdates -------------
#
# Each entry below is a real finding that is being tolerated in one file
# rather than fixed, because fixing it would change behaviour in code whose
# outputs are already published, or would be a purely cosmetic edit to a file
# nothing else is touching. New code does not get these exemptions — B905 in
# particular is enforced everywhere else, and the modules added since this
# config landed all pass `zip(..., strict=True)`.
#
# `docs/roadmap.md` tracks clearing these.
"scripts/generate_report_figures.py" = ["B905"]
"scripts/validate_health_index_versions.py" = ["B905"]
"src/bms/adaptive/calibrator.py" = ["B905"]
"src/bms/api/telemetry_routes.py" = ["B905"]
# Re-raising as HTTPException without `from` is the FastAPI convention: the
# original KeyError is an implementation detail, not something a client sees.
"src/bms/api/app.py" = ["B904"]
# `l` as a loop variable in the matplotlib legend code. Renaming it is
# cosmetic and dashboard_legacy.py is retained for reference only.
"src/bms/dashboard/dashboard.py" = ["E741"]
"src/bms/dashboard/dashboard_legacy.py" = ["E741"]
"tests/test_adaptive_store.py" = ["E741"]
# `iterrows()` yields (index, row) and only the row is used; unpacking it is
# clearer than indexing positionally.
"src/bms/explain/attribution.py" = ["B007"]
# These two set sys.path before importing the package under test.
"tests/test_telemetry_api.py" = ["E402"]
"tests/test_telemetry_pipeline.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
# Deliberately not strict. This codebase is scientific rather than
# application code, and pandas' own types are loose enough that
# disallow_untyped_defs would produce hundreds of annotations that document
# nothing. The checks enabled here catch real defects — a function that says
# it returns a float and returns None — without that noise.
disallow_untyped_defs = false
check_untyped_defs = true

# Type checking is being adopted incrementally rather than all at once.
#
# Running mypy across all of `src/bms` reports 80 errors in 18 files. They are
# overwhelmingly pandas/numpy interface friction — `np.where` returns an
# ndarray where a Series is annotated, `groupby` keys type as `Hashable` — not
# defects. Fixing them means either casts that document nothing or annotations
# that fight the libraries.
#
# It was not wasted, though: the run found a genuine bug (two definitions of
# `_evidence_confidence` in guardian.py, the first silently dead) which has
# been fixed.
#
# So the gate is scoped to the modules written against it, and widens as
# others are cleaned. A gate over everything would fail on day one and be
# switched off within a week; `docs/roadmap.md` tracks the backlog.
files = [
    "src/bms/benchmarks",
    "src/bms/physics",
    "src/bms/uncertainty",
    # Serial ingestion was written against the gate rather than retrofitted, so
    # it joins on arrival. Scoped to the three serial modules rather than all of
    # `src/bms/telemetry`, because the CAN modules predate the gate and still
    # carry the pandas interface friction described above.
    "src/bms/telemetry/serial_schema.py",
    "src/bms/telemetry/serial_source.py",
    "src/bms/telemetry/serial_pipeline.py",
]

[[tool.mypy.overrides]]
# Optional benchmark-only dependencies; not installed in every environment.
module = ["xgboost.*", "torch.*"]
ignore_missing_imports = true

# mypy follows imports, so modules outside the adopted scope get checked
# anyway when a scoped module imports them. Silencing them here keeps the
# gate meaningful — it reports on the code it is supposed to govern — without
# pretending the rest is clean. Remove an entry when that module is cleaned.
[[tool.mypy.overrides]]
module = [
    "src.bms.adaptive.*",
    "src.bms.dashboard.*",
    "src.bms.explain.*",
    "src.bms.guardian.*",
    "src.bms.health.*",
    "src.bms.io.*",
    "src.bms.preprocessing.*",
    "src.bms.risk.*",
    "src.bms.rul.*",
    "src.bms.simulation.*",
    "src.bms.telemetry.*",
    "src.bms.api.*",
    "src.bms.digital_twin.*",
]
ignore_errors = true
